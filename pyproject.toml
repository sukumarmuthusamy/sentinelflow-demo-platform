[project]
name = "sentinelflow-demo-platform"
version = "0.1.0"
description = "Synthetic multi-service demo codebase for SentinelFlow live-mode evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["services*", "shared*", "analytics_docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
