openapi: 3.1.0
info:
  title: svc-inventory contract
  version: 1.4.0
  x-effective-date: '2025-09-01'
  description: Synthetic OpenAPI contract for svc-inventory.
paths:
  /v1/inventory/health:
    get:
      operationId: svc-inventory_health
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/inventory/reserve:
    post:
      operationId: svc-inventory_reserve
      summary: Reserve inventory for a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '200':
          description: Reserved
        '409':
          description: Insufficient stock
components:
  schemas:
    ReserveRequest:
      type: object
      required:
        - correlation_id
        - sku
        - quantity
      properties:
        correlation_id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
